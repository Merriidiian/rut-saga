syntax = "proto3";
package reservation.v1;
option go_package = "reservation-service/pkg/gen;pb";
option csharp_namespace = "Reservation.V1";
import "google/api/annotations.proto";
import "validate/validate.proto";

service ReservationService {
  rpc CreateReservation(CreateReservationRequest) returns (Reservation) {
    option (google.api.http) = {post: "/api/v1/reservations" body: "*"};
  }
  rpc GetReservation(ReservationRequest) returns (Reservation) {
    option (google.api.http) = {get: "/api/v1/reservations/{reservation_id}"};
  }
  rpc ConfirmReservation(ReservationRequest) returns (Reservation) {
    option (google.api.http) = {post: "/api/v1/reservations/{reservation_id}/confirm" body: "*"};
  }
  rpc CancelReservation(ReservationRequest) returns (Reservation) {
    option (google.api.http) = {post: "/api/v1/reservations/{reservation_id}/cancel" body: "*"};
  }
}
message CreateReservationRequest {
  string reservation_id = 1 [(validate.rules).string.uuid = true];
  string product_id = 2 [(validate.rules).string.uuid = true];
  string customer_id = 3 [(validate.rules).string.uuid = true];
  int32 quantity = 4 [(validate.rules).int32.gt = 0];
  int32 expiration_minutes = 5 [(validate.rules).int32 = {gte: 1, lte: 1440}];
}
message ReservationRequest {
  string reservation_id = 1 [(validate.rules).string.uuid = true];
}
message Reservation {
  string reservation_id = 1;
  string product_id = 2;
  string customer_id = 3;
  int32 quantity = 4;
  string status = 5;
}
